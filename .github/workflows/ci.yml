name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHPUnit + couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, iconv, pdo, pdo_pgsql, intl
          coverage: pcov
          tools: composer:v2

      # Le lock est commité et maintenu à jour : on vérifie qu'il correspond au
      # composer.json, puis on installe depuis le lock (déterministe). On évite
      # `composer update`, qui re-résout tout et échoue dès qu'une alerte de
      # sécurité frappe une version épinglée de Symfony.
      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-scripts --no-interaction --prefer-dist

      # Les tests d'intégration (KernelTestCase) supposent le schéma déjà créé
      # — équivalent de `make setup-test-db`. Sans ça : « no such table ».
      # Pour SQLite, schema:create crée aussi le fichier de base ; on n'appelle
      # pas database:create --if-not-exists, non supporté par la plateforme SQLite.
      - name: Prepare test database
        run: php bin/console doctrine:schema:create --env=test

      # lexik JWT a besoin d'une paire de clés pour signer les tokens ; sans
      # elle, /api/auth/login échoue et tous les tests authentifiés cascadent.
      # Passphrase = JWT_PASSPHRASE de .env.test (« test »).
      - name: Generate JWT keypair (test)
        run: php bin/console lexik:jwt:generate-keypair --env=test --overwrite --no-interaction

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: coverage.xml
          if-no-files-found: ignore

  static-analysis:
    name: PHPStan (analyse statique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, iconv, pdo, pdo_pgsql, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-scripts --no-interaction --prefer-dist

      # Rapport informatif le temps de résorber la dette du code existant.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=table
        continue-on-error: true

  coding-standards:
    name: PHP-CS-Fixer (style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2, php-cs-fixer

      - name: Check coding standards
        run: php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php
        continue-on-error: true

  docker-build:
    name: Build image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t sbl-api:ci .
