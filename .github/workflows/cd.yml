name: CD

# Déploiement continu de l'API : sur push sur main, synchronisation du code vers
# le sous-dossier `api/` de la stack sur le serveur, rebuild du service `api`
# (PHP-FPM) via docker compose, puis exécution des migrations Doctrine.
#
# Le service `api` tourne en `restart: unless-stopped` et n'a pas de
# healthcheck : quand il plante au démarrage, il redémarre en boucle et
# `docker compose exec` échoue sur un message opaque (`exit code 137`, ou
# `Container ... is restarting` selon la version du démon). Le déploiement
# attend donc que le conteneur soit stable avant de lancer les migrations. En
# cas d'échec sur un déclenchement manuel, les logs du conteneur sont publiés
# (voir la note sur cette étape).
#
# Secrets requis :
#   SSH_HOST, SSH_USER, SSH_KEY, SSH_PORT (optionnel, défaut 22), DEPLOY_PATH
#   API_HEALTH_URL (optionnel) : URL publique de /api/health, vérifiée après
#     déploiement. Passe par un secret pour ne pas publier le domaine dans ce
#     dépôt public ; non défini, le test de fumée est ignoré.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API over SSH
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync API source
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'vendor' \
            --exclude 'var' \
            --exclude '.env.local' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            ./ "$SSH_TARGET:$DEPLOY_PATH/api/"

      # Quatre dépôts pilotent le même projet docker compose sur le même
      # serveur. La clé `concurrency:` ci-dessus ne protège que de ce dépôt :
      # ses groupes sont propres à un dépôt et ne se voient pas entre eux. Les
      # étapes qui modifient l'état Docker prennent donc un verrou côté
      # serveur, partagé avec `infrastructure`, `bot` et `SBL-app`.
      #
      # Chaque étape est une session SSH distincte, et le verrou tombe avec
      # elle : un autre déploiement peut encore s'intercaler *entre* deux
      # étapes. La fenêtre passe de « toute la durée du déploiement » à
      # « l'intervalle entre deux étapes », sans disparaître complètement.
      - name: Rebuild service
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          exec 9>/tmp/sbl-deploy.lock
          if ! flock -w 300 9; then
            echo "::error::verrou de déploiement non obtenu après 300 s : un autre déploiement est en cours"
            exit 1
          fi

          cd "$DEPLOY_PATH"
          docker compose up -d --build api api-nginx
          REMOTE

      # Étape en lecture seule (`docker inspect`), volontairement hors verrou :
      # le tenir ici bloquerait les autres déploiements jusqu'à 60 s sans rien
      # protéger.
      #
      # `docker compose up -d` rend la main dès que le conteneur est lancé, pas
      # quand il est viable. On vérifie qu'il tient debout avant d'aller plus
      # loin : `up --build` venant de recréer le conteneur, tout redémarrage
      # compté ici est forcément postérieur au déploiement, donc un crash.
      - name: Wait for the api container to stabilise
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "cd '$DEPLOY_PATH' && bash -s" <<'REMOTE'
          set -uo pipefail

          cid=$(docker compose ps -q api || true)
          if [ -z "$cid" ]; then
            echo "::error::conteneur api introuvable après 'docker compose up'"
            exit 1
          fi

          stable=0
          for attempt in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Status}}' "$cid")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")

            if [ "$restarts" -gt 0 ]; then
              echo "::error::le conteneur api a redémarré $restarts fois depuis sa recréation : il plante au démarrage"
              exit 1
            fi

            case "$status" in
              running)
                stable=$((stable + 1))
                # Trois relevés consécutifs : un conteneur qui plante après une
                # seconde ne doit pas être déclaré sain.
                if [ "$stable" -ge 3 ]; then
                  echo "conteneur api stable (running, 0 redémarrage)"
                  exit 0
                fi
                ;;
              restarting|created)
                stable=0
                echo "api est '$status' (tentative $attempt/30)…"
                ;;
              exited|dead)
                echo "::error::le conteneur api est '$status'"
                exit 1
                ;;
            esac
            sleep 2
          done

          echo "::error::le conteneur api n'est pas devenu stable en 60 s"
          exit 1
          REMOTE

      - name: Run Doctrine migrations
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          exec 9>/tmp/sbl-deploy.lock
          if ! flock -w 300 9; then
            echo "::error::verrou de déploiement non obtenu après 300 s : un autre déploiement est en cours"
            exit 1
          fi

          cd "$DEPLOY_PATH"
          docker compose exec -T api php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          REMOTE

      - name: Prune dangling images
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          exec 9>/tmp/sbl-deploy.lock
          if ! flock -w 300 9; then
            echo "::error::verrou de déploiement non obtenu après 300 s : un autre déploiement est en cours"
            exit 1
          fi

          cd "$DEPLOY_PATH"
          docker image prune -f
          REMOTE

      # Un `docker compose up` réussi ne prouve pas que l'application sert
      # quelque chose. Le 2026-08-20, ce workflow était vert — conteneur
      # stable, migrations passées — alors que tous les endpoints renvoyaient
      # 500, y compris les routes inexistantes. Un déploiement qui se déclare
      # réussi pendant que l'API est hors service est pire qu'un déploiement
      # qui échoue : personne ne va voir.
      #
      # Seul 200 est accepté : `/api/health` renvoie 503 quand une sonde
      # critique tombe, ce qui est un échec de déploiement, pas un succès.
      - name: Smoke test the health endpoint
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          set -uo pipefail

          if [ -z "${API_HEALTH_URL:-}" ]; then
            echo "::warning::secret API_HEALTH_URL non défini — test de fumée ignoré"
            exit 0
          fi

          code=000
          for attempt in $(seq 1 6); do
            # `curl -w` écrit déjà 000 quand il échoue ; l'assignation de
            # repli ne doit pas s'y ajouter, d'où `|| code=000` et non `|| echo`.
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$API_HEALTH_URL") || code=000
            if [ "$code" = "200" ]; then
              echo "/api/health répond HTTP 200"
              head -c 2000 /tmp/health.json
              exit 0
            fi
            echo "tentative $attempt/6 : HTTP $code"
            sleep 5
          done

          echo "::error::l'API ne sert pas : /api/health répond HTTP $code après 6 tentatives"
          echo '--- réponse ---'
          head -c 2000 /tmp/health.json || true
          exit 1

      # Sans ça, un plantage du conteneur n'est lisible qu'en se connectant au
      # serveur.
      #
      # Volontairement limité à `workflow_dispatch` : le dépôt est public, et
      # les logs d'un Symfony en `APP_ENV: prod` peuvent contenir des
      # identifiants. Le filtrage ci-dessous masque les formes connues
      # (identifiants d'URI, variables sensibles) mais ne peut pas tout couvrir.
      # Ces valeurs venant du `.env` du serveur et non des secrets GitHub, le
      # masquage automatique d'Actions ne s'y applique pas. On ne publie donc
      # ces logs que sur un déclenchement manuel, quand quelqu'un les regarde.
      - name: Collect container diagnostics
        if: failure() && github.event_name == 'workflow_dispatch'
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "cd '$DEPLOY_PATH' \
              && echo '--- docker compose ps ---' \
              && docker compose ps \
              && echo '--- docker compose logs api (100 dernières lignes) ---' \
              && docker compose logs --tail=100 --no-color api" 2>&1 \
            | sed -E \
                -e 's#(://[^:/@[:space:]]*):[^@[:space:]]+@#\1:***@#g' \
                -e 's#((APP_SECRET|APP_PASSWORD|JWT_PASSPHRASE|POSTGRES_PASSWORD|DISCORD_CLIENT_SECRET|DISCORD_BOT_SECRET|MAILER_DSN)[[:space:]]*[=:][[:space:]]*)[^[:space:]]+#\1***#gi' \
            || true

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
